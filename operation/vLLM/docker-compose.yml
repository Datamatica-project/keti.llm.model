services:
  models.api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vllm.api
    ports:
      - "8000:8000"
    environment:
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=miniostorage
      - TOKENIZERS_PARALLELISM=false
      - CUDA_VISIBLE_DEVICES=0
      - VLLM_SKIP_MM_PROFILING=1
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./logs:/app/logs
      - /mnt/c/Users/dm_ohminchan/RAGLLM-Feature-model-train/models/trainer_output/gemma_final:/models/checkpoint-2352
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - llm
    command: ["bash", "/app/start-vllm.sh"]

networks:
  llm:
    external: true
